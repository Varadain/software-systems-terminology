<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Clock gating and power gating</title><desc id="desc">Clock gating stops clock activity in a block; power gating disconnects a power domain and must handle state and isolation.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#243746"/></marker></defs>
  <rect width="1200" height="520" rx="22" fill="#F6F9FB"/>
  <text x="56" y="55" font-size="30" font-weight="700" fill="#243746">Clock gating and power gating</text><text x="58" y="88" font-size="16" fill="#586873">Both can save power but operate on different resources.</text>
  <rect x="42" y="152" width="544" height="265" rx="16" fill="#FFFFFF" stroke="#D7E4ED" stroke-width="2"/><path d="M58 152 H570 Q586 152 586 168 V197 H42 V168 Q42 152 58 152" fill="#AEC4D4"/><text x="314" y="183" text-anchor="middle" font-size="21" font-weight="700" fill="#243746"><tspan x="314" dy="0">Clock gating</tspan></text><text x="64" y="236" text-anchor="start" font-size="15" font-weight="400" fill="#263238"><tspan x="64" dy="0">Stops clock toggles to</tspan><tspan x="64" dy="22">reduce switching activity</tspan><tspan x="64" dy="22">in selected logic.</tspan></text><text x="64" y="333" font-size="12" font-weight="700" letter-spacing=".5" fill="#586873">EXAMPLE</text><text x="64" y="359" text-anchor="start" font-size="14" font-weight="500" fill="#243746"><tspan x="64" dy="0">clock enable / gate</tspan></text><text x="64" y="397" text-anchor="start" font-size="13" font-weight="400" fill="#586873"><tspan x="64" dy="0">Clock distribution control.</tspan></text><rect x="614" y="152" width="544" height="265" rx="16" fill="#FFFFFF" stroke="#D7E4ED" stroke-width="2"/><path d="M630 152 H1142 Q1158 152 1158 168 V197 H614 V168 Q614 152 630 152" fill="#D7E4ED"/><text x="886" y="183" text-anchor="middle" font-size="21" font-weight="700" fill="#243746"><tspan x="886" dy="0">Power gating</tspan></text><text x="636" y="236" text-anchor="start" font-size="15" font-weight="400" fill="#263238"><tspan x="636" dy="0">Turns off a supply to</tspan><tspan x="636" dy="22">a domain; state may need</tspan><tspan x="636" dy="22">retention and isolation.</tspan></text><text x="636" y="333" font-size="12" font-weight="700" letter-spacing=".5" fill="#586873">EXAMPLE</text><text x="636" y="359" text-anchor="start" font-size="14" font-weight="500" fill="#243746"><tspan x="636" dy="0">power switch + isolation</tspan></text><text x="636" y="397" text-anchor="start" font-size="13" font-weight="400" fill="#586873"><tspan x="636" dy="0">Reduce leakage in a domain.</tspan></text>
  <rect x="40" y="438" width="1120" height="54" rx="12" fill="#E5EDF2"/>
  <text x="60" y="471" font-size="14" font-weight="700" letter-spacing=".6" fill="#243746">KEY IDEA</text>
  <text x="150" y="471" font-size="16" fill="#263238">Clock gating changes activity; power gating changes whether a block is powered.</text>
</svg>
