<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Application and operating system boundary</title><desc id="desc">An application requests a protected operating-system service through a system call; the kernel interacts with hardware under platform rules.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#243746"/></marker></defs>
  <rect width="1200" height="520" rx="22" fill="#F6F9FB"/>
  <text x="56" y="55" font-size="30" font-weight="700" fill="#243746">Application and operating system boundary</text><text x="58" y="88" font-size="16" fill="#586873">User-space programs request privileged work instead of directly controlling hardware.</text>
  <rect x="25" y="174" width="250" height="214" rx="16" fill="#FFFFFF" stroke="#D7E4ED" stroke-width="2"/><path d="M41 174 H259 Q275 174 275 190 V198 H25 V190 Q25 174 41 174" fill="#AEC4D4"/><text x="150" y="237" text-anchor="middle" font-size="21" font-weight="700" fill="#243746"><tspan x="150" dy="0">Application</tspan></text><text x="150" y="277" text-anchor="middle" font-size="15" font-weight="400" fill="#263238"><tspan x="150" dy="0">Runs in user space;</tspan><tspan x="150" dy="21">uses libraries</tspan></text><rect x="40" y="344" width="220" height="28" rx="7" fill="#F6F9FB"/><text x="150" y="363" text-anchor="middle" font-size="13" font-weight="600" fill="#586873"><tspan x="150" dy="0">read a file</tspan></text><line x1="280" y1="278" x2="318" y2="278" stroke="#243746" stroke-width="2.5" marker-end="url(#arrow)"/><text x="299" y="164" text-anchor="middle" font-size="12" font-weight="600" fill="#586873"><tspan x="299" dy="0">request</tspan></text><rect x="325" y="174" width="250" height="214" rx="16" fill="#FFFFFF" stroke="#D7E4ED" stroke-width="2"/><path d="M341 174 H559 Q575 174 575 190 V198 H325 V190 Q325 174 341 174" fill="#D7E4ED"/><text x="450" y="237" text-anchor="middle" font-size="21" font-weight="700" fill="#243746"><tspan x="450" dy="0">System call</tspan></text><text x="450" y="277" text-anchor="middle" font-size="15" font-weight="400" fill="#263238"><tspan x="450" dy="0">Crosses the user /</tspan><tspan x="450" dy="21">kernel boundary</tspan></text><rect x="340" y="344" width="220" height="28" rx="7" fill="#F6F9FB"/><text x="450" y="363" text-anchor="middle" font-size="13" font-weight="600" fill="#586873"><tspan x="450" dy="0">open(), read()</tspan></text><line x1="580" y1="278" x2="618" y2="278" stroke="#243746" stroke-width="2.5" marker-end="url(#arrow)"/><text x="599" y="164" text-anchor="middle" font-size="12" font-weight="600" fill="#586873"><tspan x="599" dy="0">validate</tspan></text><rect x="625" y="174" width="250" height="214" rx="16" fill="#FFFFFF" stroke="#D7E4ED" stroke-width="2"/><path d="M641 174 H859 Q875 174 875 190 V198 H625 V190 Q625 174 641 174" fill="#E5EDF2"/><text x="750" y="237" text-anchor="middle" font-size="21" font-weight="700" fill="#243746"><tspan x="750" dy="0">Kernel</tspan></text><text x="750" y="277" text-anchor="middle" font-size="15" font-weight="400" fill="#263238"><tspan x="750" dy="0">Checks access and</tspan><tspan x="750" dy="21">manages resources</tspan></text><rect x="640" y="344" width="220" height="28" rx="7" fill="#F6F9FB"/><text x="750" y="363" text-anchor="middle" font-size="13" font-weight="600" fill="#586873"><tspan x="750" dy="0">driver + scheduler</tspan></text><line x1="880" y1="278" x2="918" y2="278" stroke="#243746" stroke-width="2.5" marker-end="url(#arrow)"/><text x="899" y="164" text-anchor="middle" font-size="12" font-weight="600" fill="#586873"><tspan x="899" dy="0">control</tspan></text><rect x="925" y="174" width="250" height="214" rx="16" fill="#FFFFFF" stroke="#D7E4ED" stroke-width="2"/><path d="M941 174 H1159 Q1175 174 1175 190 V198 H925 V190 Q925 174 941 174" fill="#DDEFE5"/><text x="1050" y="237" text-anchor="middle" font-size="21" font-weight="700" fill="#243746"><tspan x="1050" dy="0">Device</tspan></text><text x="1050" y="277" text-anchor="middle" font-size="15" font-weight="400" fill="#263238"><tspan x="1050" dy="0">Performs I/O or</tspan><tspan x="1050" dy="21">signals an event</tspan></text><rect x="940" y="344" width="220" height="28" rx="7" fill="#F6F9FB"/><text x="1050" y="363" text-anchor="middle" font-size="13" font-weight="600" fill="#586873"><tspan x="1050" dy="0">disk, NIC</tspan></text>
  <rect x="40" y="438" width="1120" height="54" rx="12" fill="#E5EDF2"/>
  <text x="60" y="471" font-size="14" font-weight="700" letter-spacing=".6" fill="#243746">KEY IDEA</text>
  <text x="150" y="471" font-size="16" fill="#263238">A system call is a controlled entry point, not simply a function in your program.</text>
</svg>
