<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Authentication and authorization</title><desc id="desc">A system first establishes which identity is acting, then checks whether that identity may perform a requested action.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#243746"/></marker></defs>
  <rect width="1200" height="520" rx="22" fill="#F6F9FB"/>
  <text x="56" y="55" font-size="30" font-weight="700" fill="#243746">Authentication and authorization</text><text x="58" y="88" font-size="16" fill="#586873">Knowing who is acting does not automatically grant permission.</text>
  <rect x="25" y="174" width="250" height="214" rx="16" fill="#FFFFFF" stroke="#D7E4ED" stroke-width="2"/><path d="M41 174 H259 Q275 174 275 190 V198 H25 V190 Q25 174 41 174" fill="#AEC4D4"/><text x="150" y="237" text-anchor="middle" font-size="21" font-weight="700" fill="#243746"><tspan x="150" dy="0">Identity claim</tspan></text><text x="150" y="277" text-anchor="middle" font-size="15" font-weight="400" fill="#263238"><tspan x="150" dy="0">User or service</tspan><tspan x="150" dy="21">presents a credential</tspan></text><rect x="40" y="344" width="220" height="28" rx="7" fill="#F6F9FB"/><text x="150" y="363" text-anchor="middle" font-size="13" font-weight="600" fill="#586873"><tspan x="150" dy="0">session / token</tspan></text><line x1="280" y1="278" x2="318" y2="278" stroke="#243746" stroke-width="2.5" marker-end="url(#arrow)"/><text x="299" y="164" text-anchor="middle" font-size="12" font-weight="600" fill="#586873"><tspan x="299" dy="0">present</tspan></text><rect x="325" y="174" width="250" height="214" rx="16" fill="#FFFFFF" stroke="#D7E4ED" stroke-width="2"/><path d="M341 174 H559 Q575 174 575 190 V198 H325 V190 Q325 174 341 174" fill="#D7E4ED"/><text x="450" y="237" text-anchor="middle" font-size="21" font-weight="700" fill="#243746"><tspan x="450" dy="0">Authentication</tspan></text><text x="450" y="277" text-anchor="middle" font-size="15" font-weight="400" fill="#263238"><tspan x="450" dy="0">Check credential;</tspan><tspan x="450" dy="21">establish identity</tspan></text><rect x="340" y="344" width="220" height="28" rx="7" fill="#F6F9FB"/><text x="450" y="363" text-anchor="middle" font-size="13" font-weight="600" fill="#586873"><tspan x="450" dy="0">who is acting?</tspan></text><line x1="580" y1="278" x2="618" y2="278" stroke="#243746" stroke-width="2.5" marker-end="url(#arrow)"/><text x="599" y="164" text-anchor="middle" font-size="12" font-weight="600" fill="#586873"><tspan x="599" dy="0">verify</tspan></text><rect x="625" y="174" width="250" height="214" rx="16" fill="#FFFFFF" stroke="#D7E4ED" stroke-width="2"/><path d="M641 174 H859 Q875 174 875 190 V198 H625 V190 Q625 174 641 174" fill="#E5EDF2"/><text x="750" y="237" text-anchor="middle" font-size="21" font-weight="700" fill="#243746"><tspan x="750" dy="0">Authorization</tspan></text><text x="750" y="277" text-anchor="middle" font-size="15" font-weight="400" fill="#263238"><tspan x="750" dy="0">Check policy for</tspan><tspan x="750" dy="21">this action + resource</tspan></text><rect x="640" y="344" width="220" height="28" rx="7" fill="#F6F9FB"/><text x="750" y="363" text-anchor="middle" font-size="13" font-weight="600" fill="#586873"><tspan x="750" dy="0">allowed?</tspan></text><line x1="880" y1="278" x2="918" y2="278" stroke="#243746" stroke-width="2.5" marker-end="url(#arrow)"/><text x="899" y="164" text-anchor="middle" font-size="12" font-weight="600" fill="#586873"><tspan x="899" dy="0">allow / deny</tspan></text><rect x="925" y="174" width="250" height="214" rx="16" fill="#FFFFFF" stroke="#D7E4ED" stroke-width="2"/><path d="M941 174 H1159 Q1175 174 1175 190 V198 H925 V190 Q925 174 941 174" fill="#DDEFE5"/><text x="1050" y="237" text-anchor="middle" font-size="21" font-weight="700" fill="#243746"><tspan x="1050" dy="0">Resource</tspan></text><text x="1050" y="277" text-anchor="middle" font-size="15" font-weight="400" fill="#263238"><tspan x="1050" dy="0">Perform action only</tspan><tspan x="1050" dy="21">if permitted</tspan></text><rect x="940" y="344" width="220" height="28" rx="7" fill="#F6F9FB"/><text x="1050" y="363" text-anchor="middle" font-size="13" font-weight="600" fill="#586873"><tspan x="1050" dy="0">read report</tspan></text>
  <rect x="40" y="438" width="1120" height="54" rx="12" fill="#E5EDF2"/>
  <text x="60" y="471" font-size="14" font-weight="700" letter-spacing=".6" fill="#243746">KEY IDEA</text>
  <text x="150" y="471" font-size="16" fill="#263238">Authentication answers who; authorization answers what that identity may do.</text>
</svg>
