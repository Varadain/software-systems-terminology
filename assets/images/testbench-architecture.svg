<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">How a hardware testbench checks a design</title><desc id="desc">A sequence drives a design under test; a monitor samples outputs; a scoreboard compares them with a reference model while assertions and coverage observe behavior.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#243746"/></marker></defs>
  <rect width="1200" height="520" rx="22" fill="#F6F9FB"/>
  <text x="56" y="55" font-size="30" font-weight="700" fill="#243746">How a hardware testbench checks a design</text><text x="58" y="88" font-size="16" fill="#586873">Stimulus, observation, checking, and measurement have separate roles.</text>
  
 <rect x="40" y="195" width="190" height="105" rx="14" fill="#FFFFFF" stroke="#D7E4ED" stroke-width="2"/>
 <text x="135" y="232" text-anchor="middle" font-size="19" font-weight="700" fill="#243746"><tspan x="135" dy="0">Sequence</tspan></text><text x="135" y="261" text-anchor="middle" font-size="14" font-weight="400" fill="#263238"><tspan x="135" dy="0">test scenario</tspan></text>
 <line x1="230" y1="247" x2="292" y2="247" stroke="#243746" stroke-width="2" marker-end="url(#arrow)"/>
 <rect x="292" y="195" width="190" height="105" rx="14" fill="#D7E4ED" stroke="#AEC4D4" stroke-width="2"/>
 <text x="387" y="232" text-anchor="middle" font-size="19" font-weight="700" fill="#243746"><tspan x="387" dy="0">Driver</tspan></text><text x="387" y="261" text-anchor="middle" font-size="14" font-weight="400" fill="#263238"><tspan x="387" dy="0">applies inputs</tspan></text>
 <line x1="482" y1="247" x2="544" y2="247" stroke="#243746" stroke-width="2" marker-end="url(#arrow)"/>
 <rect x="544" y="195" width="190" height="105" rx="14" fill="#AEC4D4" stroke="#243746" stroke-width="2"/>
 <text x="639" y="232" text-anchor="middle" font-size="21" font-weight="700" fill="#243746"><tspan x="639" dy="0">DUT</tspan></text><text x="639" y="261" text-anchor="middle" font-size="14" font-weight="400" fill="#263238"><tspan x="639" dy="0">design under test</tspan></text>
 <line x1="734" y1="247" x2="796" y2="247" stroke="#243746" stroke-width="2" marker-end="url(#arrow)"/>
 <rect x="796" y="195" width="190" height="105" rx="14" fill="#D7E4ED" stroke="#AEC4D4" stroke-width="2"/>
 <text x="891" y="232" text-anchor="middle" font-size="19" font-weight="700" fill="#243746"><tspan x="891" dy="0">Monitor</tspan></text><text x="891" y="261" text-anchor="middle" font-size="14" font-weight="400" fill="#263238"><tspan x="891" dy="0">observes signals</tspan></text>
 <line x1="986" y1="247" x2="1048" y2="247" stroke="#243746" stroke-width="2" marker-end="url(#arrow)"/>
 <rect x="1048" y="195" width="120" height="105" rx="14" fill="#DDEFE5" stroke="#D7E4ED" stroke-width="2"/>
 <text x="1108" y="232" text-anchor="middle" font-size="17" font-weight="700" fill="#243746"><tspan x="1108" dy="0">Score</tspan></text><text x="1108" y="257" text-anchor="middle" font-size="17" font-weight="700" fill="#243746"><tspan x="1108" dy="0">board</tspan></text>
 <rect x="430" y="330" width="300" height="56" rx="12" fill="#E5EDF2"/>
 <text x="580" y="353" text-anchor="middle" font-size="16" font-weight="700" fill="#243746"><tspan x="580" dy="0">Reference model</tspan></text><text x="580" y="375" text-anchor="middle" font-size="13" font-weight="400" fill="#263238"><tspan x="580" dy="0">computes expected result</tspan></text>
 <line x1="730" y1="358" x2="1080" y2="302" stroke="#243746" stroke-width="2" marker-end="url(#arrow)"/>
 <rect x="760" y="120" width="190" height="48" rx="12" fill="#F8EACB"/>
 <text x="855" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#243746"><tspan x="855" dy="0">Assertions + coverage</tspan></text>
 <line x1="855" y1="168" x2="680" y2="192" stroke="#243746" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="438" width="1120" height="54" rx="12" fill="#E5EDF2"/>
  <text x="60" y="471" font-size="14" font-weight="700" letter-spacing=".6" fill="#243746">KEY IDEA</text>
  <text x="150" y="471" font-size="16" fill="#263238">A scoreboard compares expected and observed results; coverage records exercised scenarios.</text>
</svg>
