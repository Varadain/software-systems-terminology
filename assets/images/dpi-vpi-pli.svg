<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">DPI, VPI, and PLI</title><desc id="desc">Different simulator interfaces connect external code with hardware-language simulation in different ways.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#243746"/></marker></defs>
  <rect width="1200" height="520" rx="22" fill="#F6F9FB"/>
  <text x="56" y="55" font-size="30" font-weight="700" fill="#243746">DPI, VPI, and PLI</text><text x="58" y="88" font-size="16" fill="#586873">The language standard and simulator determine which features are supported.</text>
  <rect x="42" y="152" width="360" height="265" rx="16" fill="#FFFFFF" stroke="#D7E4ED" stroke-width="2"/><path d="M58 152 H386 Q402 152 402 168 V197 H42 V168 Q42 152 58 152" fill="#AEC4D4"/><text x="222" y="183" text-anchor="middle" font-size="21" font-weight="700" fill="#243746"><tspan x="222" dy="0">DPI</tspan></text><text x="64" y="236" text-anchor="start" font-size="15" font-weight="400" fill="#263238"><tspan x="64" dy="0">SystemVerilog's foreign</tspan><tspan x="64" dy="22">function calls, commonly</tspan><tspan x="64" dy="22">to and from C.</tspan></text><text x="64" y="333" font-size="12" font-weight="700" letter-spacing=".5" fill="#586873">EXAMPLE</text><text x="64" y="359" text-anchor="start" font-size="14" font-weight="500" fill="#243746"><tspan x="64" dy="0">SV calls a C model</tspan></text><text x="64" y="397" text-anchor="start" font-size="13" font-weight="400" fill="#586873"><tspan x="64" dy="0">Call a reference routine.</tspan></text><rect x="420" y="152" width="360" height="265" rx="16" fill="#FFFFFF" stroke="#D7E4ED" stroke-width="2"/><path d="M436 152 H764 Q780 152 780 168 V197 H420 V168 Q420 152 436 152" fill="#D7E4ED"/><text x="600" y="183" text-anchor="middle" font-size="21" font-weight="700" fill="#243746"><tspan x="600" dy="0">VPI</tspan></text><text x="442" y="236" text-anchor="start" font-size="15" font-weight="400" fill="#263238"><tspan x="442" dy="0">Verilog interface to</tspan><tspan x="442" dy="22">inspect or control</tspan><tspan x="442" dy="22">simulation objects.</tspan></text><text x="442" y="333" font-size="12" font-weight="700" letter-spacing=".5" fill="#586873">EXAMPLE</text><text x="442" y="359" text-anchor="start" font-size="14" font-weight="500" fill="#243746"><tspan x="442" dy="0">C reads signal handles</tspan></text><text x="442" y="397" text-anchor="start" font-size="13" font-weight="400" fill="#586873"><tspan x="442" dy="0">Simulator control and access.</tspan></text><rect x="798" y="152" width="360" height="265" rx="16" fill="#FFFFFF" stroke="#D7E4ED" stroke-width="2"/><path d="M814 152 H1142 Q1158 152 1158 168 V197 H798 V168 Q798 152 814 152" fill="#E5EDF2"/><text x="978" y="183" text-anchor="middle" font-size="21" font-weight="700" fill="#243746"><tspan x="978" dy="0">PLI</tspan></text><text x="820" y="236" text-anchor="start" font-size="15" font-weight="400" fill="#263238"><tspan x="820" dy="0">Earlier Verilog language</tspan><tspan x="820" dy="22">interface mechanisms and</tspan><tspan x="820" dy="22">legacy integrations.</tspan></text><text x="820" y="333" font-size="12" font-weight="700" letter-spacing=".5" fill="#586873">EXAMPLE</text><text x="820" y="359" text-anchor="start" font-size="14" font-weight="500" fill="#243746"><tspan x="820" dy="0">older simulator hooks</tspan></text><text x="820" y="397" text-anchor="start" font-size="13" font-weight="400" fill="#586873"><tspan x="820" dy="0">Maintain compatible tools.</tspan></text>
  <rect x="40" y="438" width="1120" height="54" rx="12" fill="#E5EDF2"/>
  <text x="60" y="471" font-size="14" font-weight="700" letter-spacing=".6" fill="#243746">KEY IDEA</text>
  <text x="150" y="471" font-size="16" fill="#263238">DPI is not a generic name for every foreign-language simulator interface.</text>
</svg>
