<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">A process contains threads</title><desc id="desc">A process owns resources such as an address space; its threads have separate execution state and can share process memory.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#243746"/></marker></defs>
  <rect width="1200" height="520" rx="22" fill="#F6F9FB"/>
  <text x="56" y="55" font-size="30" font-weight="700" fill="#243746">A process contains threads</text><text x="58" y="88" font-size="16" fill="#586873">Threads share some resources but still execute independently.</text>
  
 <rect x="90" y="150" width="1020" height="250" rx="22" fill="#FFFFFF" stroke="#243746" stroke-width="3"/>
 <rect x="90" y="150" width="1020" height="48" rx="18" fill="#AEC4D4"/>
 <text x="600" y="181" text-anchor="middle" font-size="18" font-weight="700" fill="#243746"><tspan x="600" dy="0">PROCESS: address space and owned resources</tspan></text>
 <rect x="130" y="225" width="270" height="100" rx="14" fill="#D7E4ED" stroke="#AEC4D4" stroke-width="2"/>
 <text x="265" y="258" text-anchor="middle" font-size="20" font-weight="700" fill="#243746"><tspan x="265" dy="0">Thread 1</tspan></text><text x="265" y="286" text-anchor="middle" font-size="15" font-weight="400" fill="#263238"><tspan x="265" dy="0">own stack + registers</tspan></text>
 <rect x="465" y="225" width="270" height="100" rx="14" fill="#D7E4ED" stroke="#AEC4D4" stroke-width="2"/>
 <text x="600" y="258" text-anchor="middle" font-size="20" font-weight="700" fill="#243746"><tspan x="600" dy="0">Thread 2</tspan></text><text x="600" y="286" text-anchor="middle" font-size="15" font-weight="400" fill="#263238"><tspan x="600" dy="0">own stack + registers</tspan></text>
 <rect x="800" y="225" width="270" height="100" rx="14" fill="#D7E4ED" stroke="#AEC4D4" stroke-width="2"/>
 <text x="935" y="258" text-anchor="middle" font-size="20" font-weight="700" fill="#243746"><tspan x="935" dy="0">Thread 3</tspan></text><text x="935" y="286" text-anchor="middle" font-size="15" font-weight="400" fill="#263238"><tspan x="935" dy="0">own stack + registers</tspan></text>
 <rect x="280" y="344" width="640" height="42" rx="10" fill="#DDEFE5"/>
 <text x="600" y="371" text-anchor="middle" font-size="16" font-weight="600" fill="#263238"><tspan x="600" dy="0">Shared process memory and resources</tspan></text>
 <line x1="265" y1="325" x2="390" y2="344" stroke="#243746" stroke-width="2" marker-end="url(#arrow)"/>
 <line x1="600" y1="325" x2="600" y2="340" stroke="#243746" stroke-width="2" marker-end="url(#arrow)"/>
 <line x1="935" y1="325" x2="810" y2="344" stroke="#243746" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="438" width="1120" height="54" rx="12" fill="#E5EDF2"/>
  <text x="60" y="471" font-size="14" font-weight="700" letter-spacing=".6" fill="#243746">KEY IDEA</text>
  <text x="150" y="471" font-size="16" fill="#263238">Threads can share data quickly, so shared state needs synchronization.</text>
</svg>
