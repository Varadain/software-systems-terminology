<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Test levels: from small checks to full journeys</title><desc id="desc">A test pyramid: many focused unit tests form the broad base, with fewer integration and end-to-end tests above.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#243746"/></marker></defs>
  <rect width="1200" height="520" rx="22" fill="#F6F9FB"/>
  <text x="56" y="55" font-size="30" font-weight="700" fill="#243746">Test levels: from small checks to full journeys</text><text x="58" y="88" font-size="16" fill="#586873">Broader tests cover more boundaries and usually cost more to diagnose.</text>
  
 <polygon points="600,145 300,395 900,395" fill="#AEC4D4" stroke="#243746" stroke-width="2"/>
 <polygon points="600,205 390,372 810,372" fill="#D7E4ED" stroke="#243746" stroke-width="2"/>
 <polygon points="600,267 482,350 718,350" fill="#DDEFE5" stroke="#243746" stroke-width="2"/>
 <text x="600" y="330" text-anchor="middle" font-size="17" font-weight="700" fill="#243746"><tspan x="600" dy="0">End-to-end</tspan></text>
 <text x="600" y="286" text-anchor="middle" font-size="17" font-weight="700" fill="#243746"><tspan x="600" dy="0">Integration</tspan></text>
 <text x="600" y="233" text-anchor="middle" font-size="18" font-weight="700" fill="#243746"><tspan x="600" dy="0">Unit tests</tspan></text>
 <text x="930" y="260" font-size="15" fill="#263238">Few broad journeys</text>
 <text x="930" y="284" font-size="14" fill="#586873">Cross system boundaries</text>
 <text x="930" y="355" font-size="15" fill="#263238">Many focused checks</text>
 <text x="930" y="379" font-size="14" fill="#586873">Fast, narrow feedback</text>
 <line x1="895" y1="276" x2="922" y2="276" stroke="#243746" stroke-width="2"/>
 <line x1="895" y1="369" x2="922" y2="369" stroke="#243746" stroke-width="2"/>
  <rect x="40" y="438" width="1120" height="54" rx="12" fill="#E5EDF2"/>
  <text x="60" y="471" font-size="14" font-weight="700" letter-spacing=".6" fill="#243746">KEY IDEA</text>
  <text x="150" y="471" font-size="16" fill="#263238">The pyramid is a planning guide; real test portfolios depend on risk and architecture.</text>
</svg>
