<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Programmed I/O and DMA</title><desc id="desc">Compares CPU-mediated data movement with device-driven Direct Memory Access after software configures the transfer.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#243746"/></marker></defs>
  <rect width="1200" height="520" rx="22" fill="#F6F9FB"/>
  <text x="56" y="55" font-size="30" font-weight="700" fill="#243746">Programmed I/O and DMA</text><text x="58" y="88" font-size="16" fill="#586873">DMA reduces CPU copying but still needs careful setup and synchronization.</text>
  <rect x="42" y="152" width="544" height="265" rx="16" fill="#FFFFFF" stroke="#D7E4ED" stroke-width="2"/><path d="M58 152 H570 Q586 152 586 168 V197 H42 V168 Q42 152 58 152" fill="#AEC4D4"/><text x="314" y="183" text-anchor="middle" font-size="21" font-weight="700" fill="#243746"><tspan x="314" dy="0">Programmed I/O</tspan></text><text x="64" y="236" text-anchor="start" font-size="15" font-weight="400" fill="#263238"><tspan x="64" dy="0">CPU reads or writes</tspan><tspan x="64" dy="22">device data directly,</tspan><tspan x="64" dy="22">often in a loop.</tspan></text><text x="64" y="333" font-size="12" font-weight="700" letter-spacing=".5" fill="#586873">EXAMPLE</text><text x="64" y="359" text-anchor="start" font-size="14" font-weight="500" fill="#243746"><tspan x="64" dy="0">CPU copies each word</tspan></text><text x="64" y="397" text-anchor="start" font-size="13" font-weight="400" fill="#586873"><tspan x="64" dy="0">Simple or small transfers.</tspan></text><rect x="614" y="152" width="544" height="265" rx="16" fill="#FFFFFF" stroke="#D7E4ED" stroke-width="2"/><path d="M630 152 H1142 Q1158 152 1158 168 V197 H614 V168 Q614 152 630 152" fill="#D7E4ED"/><text x="886" y="183" text-anchor="middle" font-size="21" font-weight="700" fill="#243746"><tspan x="886" dy="0">DMA</tspan></text><text x="636" y="236" text-anchor="start" font-size="15" font-weight="400" fill="#263238"><tspan x="636" dy="0">CPU configures transfer;</tspan><tspan x="636" dy="22">device moves a block</tspan><tspan x="636" dy="22">to or from memory.</tspan></text><text x="636" y="333" font-size="12" font-weight="700" letter-spacing=".5" fill="#586873">EXAMPLE</text><text x="636" y="359" text-anchor="start" font-size="14" font-weight="500" fill="#243746"><tspan x="636" dy="0">device → memory → interrupt</tspan></text><text x="636" y="397" text-anchor="start" font-size="13" font-weight="400" fill="#586873"><tspan x="636" dy="0">Larger transfers; platform rules apply.</tspan></text>
  <rect x="40" y="438" width="1120" height="54" rx="12" fill="#E5EDF2"/>
  <text x="60" y="471" font-size="14" font-weight="700" letter-spacing=".6" fill="#243746">KEY IDEA</text>
  <text x="150" y="471" font-size="16" fill="#263238">DMA does not remove software coordination, address mapping, or completion handling.</text>
</svg>
