<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Concurrency and parallelism</title><desc id="desc">Timeline comparison: concurrent tasks make progress by interleaving on one worker; parallel tasks execute at the same time on separate workers.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#243746"/></marker></defs>
  <rect width="1200" height="520" rx="22" fill="#F6F9FB"/>
  <text x="56" y="55" font-size="30" font-weight="700" fill="#243746">Concurrency and parallelism</text><text x="58" y="88" font-size="16" fill="#586873">Concurrency is about overlapping progress; parallelism is simultaneous execution.</text>
  
 <text x="65" y="182" font-size="18" font-weight="700" fill="#243746">CONCURRENT: one worker interleaves tasks</text>
 <line x1="340" y1="206" x2="1120" y2="206" stroke="#586873" stroke-width="2" marker-end="url(#arrow)"/>
 <text x="335" y="244" text-anchor="end" font-size="14" font-weight="500" fill="#586873"><tspan x="335" dy="0">time</tspan></text>
 <rect x="370" y="226" width="185" height="48" rx="8" fill="#AEC4D4"/><text x="462" y="256" text-anchor="middle" font-size="16" font-weight="700" fill="#243746"><tspan x="462" dy="0">Task A</tspan></text>
 <rect x="555" y="226" width="185" height="48" rx="8" fill="#DDEFE5"/><text x="647" y="256" text-anchor="middle" font-size="16" font-weight="700" fill="#243746"><tspan x="647" dy="0">Task B</tspan></text>
 <rect x="740" y="226" width="185" height="48" rx="8" fill="#AEC4D4"/><text x="832" y="256" text-anchor="middle" font-size="16" font-weight="700" fill="#243746"><tspan x="832" dy="0">Task A</tspan></text>
 <rect x="925" y="226" width="150" height="48" rx="8" fill="#DDEFE5"/><text x="1000" y="256" text-anchor="middle" font-size="16" font-weight="700" fill="#243746"><tspan x="1000" dy="0">Task B</tspan></text>
 <text x="65" y="315" font-size="18" font-weight="700" fill="#243746">PARALLEL: separate workers run simultaneously</text>
 <text x="95" y="360" font-size="15" fill="#586873">Worker 1</text><text x="95" y="408" font-size="15" fill="#586873">Worker 2</text>
 <line x1="340" y1="430" x2="1120" y2="430" stroke="#586873" stroke-width="2" marker-end="url(#arrow)"/>
 <rect x="370" y="334" width="420" height="42" rx="8" fill="#AEC4D4"/><text x="580" y="361" text-anchor="middle" font-size="16" font-weight="700" fill="#243746"><tspan x="580" dy="0">Task A</tspan></text>
 <rect x="370" y="382" width="420" height="42" rx="8" fill="#DDEFE5"/><text x="580" y="409" text-anchor="middle" font-size="16" font-weight="700" fill="#243746"><tspan x="580" dy="0">Task B</tspan></text>
  <rect x="40" y="438" width="1120" height="54" rx="12" fill="#E5EDF2"/>
  <text x="60" y="471" font-size="14" font-weight="700" letter-spacing=".6" fill="#243746">KEY IDEA</text>
  <text x="150" y="471" font-size="16" fill="#263238">A program can be concurrent without running tasks at the same instant.</text>
</svg>
