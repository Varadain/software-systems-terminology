<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">From edits to a Git commit</title><desc id="desc">Git records selected working-tree changes as a commit and can share that commit with a remote repository.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#243746"/></marker></defs>
  <rect width="1200" height="520" rx="22" fill="#F6F9FB"/>
  <text x="56" y="55" font-size="30" font-weight="700" fill="#243746">From edits to a Git commit</text><text x="58" y="88" font-size="16" fill="#586873">The staging area lets you choose what the next commit contains.</text>
  <rect x="25" y="174" width="250" height="214" rx="16" fill="#FFFFFF" stroke="#D7E4ED" stroke-width="2"/><path d="M41 174 H259 Q275 174 275 190 V198 H25 V190 Q25 174 41 174" fill="#AEC4D4"/><text x="150" y="237" text-anchor="middle" font-size="21" font-weight="700" fill="#243746"><tspan x="150" dy="0">Working tree</tspan></text><text x="150" y="277" text-anchor="middle" font-size="15" font-weight="400" fill="#263238"><tspan x="150" dy="0">Edit tracked files or</tspan><tspan x="150" dy="21">add new files</tspan></text><rect x="40" y="344" width="220" height="28" rx="7" fill="#F6F9FB"/><text x="150" y="363" text-anchor="middle" font-size="13" font-weight="600" fill="#586873"><tspan x="150" dy="0">modify parser.py</tspan></text><line x1="280" y1="278" x2="318" y2="278" stroke="#243746" stroke-width="2.5" marker-end="url(#arrow)"/><text x="299" y="164" text-anchor="middle" font-size="12" font-weight="600" fill="#586873"><tspan x="299" dy="0">select</tspan></text><rect x="325" y="174" width="250" height="214" rx="16" fill="#FFFFFF" stroke="#D7E4ED" stroke-width="2"/><path d="M341 174 H559 Q575 174 575 190 V198 H325 V190 Q325 174 341 174" fill="#D7E4ED"/><text x="450" y="237" text-anchor="middle" font-size="21" font-weight="700" fill="#243746"><tspan x="450" dy="0">Staging area</tspan></text><text x="450" y="277" text-anchor="middle" font-size="15" font-weight="400" fill="#263238"><tspan x="450" dy="0">Select changes for</tspan><tspan x="450" dy="21">the next snapshot</tspan></text><rect x="340" y="344" width="220" height="28" rx="7" fill="#F6F9FB"/><text x="450" y="363" text-anchor="middle" font-size="13" font-weight="600" fill="#586873"><tspan x="450" dy="0">git add</tspan></text><line x1="580" y1="278" x2="618" y2="278" stroke="#243746" stroke-width="2.5" marker-end="url(#arrow)"/><text x="599" y="164" text-anchor="middle" font-size="12" font-weight="600" fill="#586873"><tspan x="599" dy="0">record</tspan></text><rect x="625" y="174" width="250" height="214" rx="16" fill="#FFFFFF" stroke="#D7E4ED" stroke-width="2"/><path d="M641 174 H859 Q875 174 875 190 V198 H625 V190 Q625 174 641 174" fill="#E5EDF2"/><text x="750" y="237" text-anchor="middle" font-size="21" font-weight="700" fill="#243746"><tspan x="750" dy="0">Commit</tspan></text><text x="750" y="277" text-anchor="middle" font-size="15" font-weight="400" fill="#263238"><tspan x="750" dy="0">Record snapshot and</tspan><tspan x="750" dy="21">message on a branch</tspan></text><rect x="640" y="344" width="220" height="28" rx="7" fill="#F6F9FB"/><text x="750" y="363" text-anchor="middle" font-size="13" font-weight="600" fill="#586873"><tspan x="750" dy="0">git commit</tspan></text><line x1="880" y1="278" x2="918" y2="278" stroke="#243746" stroke-width="2.5" marker-end="url(#arrow)"/><text x="899" y="164" text-anchor="middle" font-size="12" font-weight="600" fill="#586873"><tspan x="899" dy="0">share</tspan></text><rect x="925" y="174" width="250" height="214" rx="16" fill="#FFFFFF" stroke="#D7E4ED" stroke-width="2"/><path d="M941 174 H1159 Q1175 174 1175 190 V198 H925 V190 Q925 174 941 174" fill="#DDEFE5"/><text x="1050" y="237" text-anchor="middle" font-size="21" font-weight="700" fill="#243746"><tspan x="1050" dy="0">Remote</tspan></text><text x="1050" y="277" text-anchor="middle" font-size="15" font-weight="400" fill="#263238"><tspan x="1050" dy="0">Share commits; fetch</tspan><tspan x="1050" dy="21">others' updates</tspan></text><rect x="940" y="344" width="220" height="28" rx="7" fill="#F6F9FB"/><text x="1050" y="363" text-anchor="middle" font-size="13" font-weight="600" fill="#586873"><tspan x="1050" dy="0">git push / fetch</tspan></text>
  <rect x="40" y="438" width="1120" height="54" rx="12" fill="#E5EDF2"/>
  <text x="60" y="471" font-size="14" font-weight="700" letter-spacing=".6" fill="#243746">KEY IDEA</text>
  <text x="150" y="471" font-size="16" fill="#263238">A commit is local until it is pushed to a remote.</text>
</svg>
